services:
  udpbrutal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org|direct}
    restart: unless-stopped
    command: ["server", "-c", "/etc/udpbrutal/config.yaml"]
    ports:
      - "443:443/udp"       # UDPBrutal tunnel
      - "18080:18080/tcp"   # Example reverseTCP listener
      - "15353:15353/udp"   # Example reverseUDP listener
    volumes:
      - ./config.yaml:/etc/udpbrutal/config.yaml:ro
