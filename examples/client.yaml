server: your-server.example.com:443
auth: example-password

bandwidth:
  up: 100 mbps
  down: 100 mbps
  disableLossCompensation: false

transport:
  type: udp
  udp:
    idleTimeout: 30s
    handshakeTimeout: 5s

socks5:
  listen: 127.0.0.1:1080
  # username: user
  # password: pass
  disableUDP: false

