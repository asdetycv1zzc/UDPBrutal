listen: :443

# 与客户端 auth 一致；HTTP/3 认证消息通过明文传输配置发送。
auth:
  type: password
  password: example-password

bandwidth:
  up: 100 mbps
  down: 100 mbps
  disableLossCompensation: false

transport:
  type: udp

# 与固定 HY2 版本相同的流控、超时与路径 MTU 选项。
quic:
  initStreamReceiveWindow: 8388608
  maxStreamReceiveWindow: 8388608
  initConnReceiveWindow: 20971520
  maxConnReceiveWindow: 20971520
  maxIdleTimeout: 30s
  maxIncomingStreams: 1024
  disablePathMTUDiscovery: false

# 基于原生双向流和 DATAGRAM 的反向映射扩展。
reverse:
  enabled: true
  maxListeners: 16

# 服务器每条反向隧道的 UDP 会话及排队预算；客户端可配置相同字段。
reverseUDPOptions:
  maxSessions: 4096
  queuePackets: 64
  maxQueuedBytes: 16777216
  batchSize: 32

disableUDP: false
udpIdleTimeout: 60s
